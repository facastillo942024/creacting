# CreactingCinema - sitio Nginx aislado en el puerto 8080.
# No interfiere con Apache (80/443) ni con los sitios wompi-app/default.
server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    client_max_body_size 12M;

    root /var/www/creacting;
    index index.html;

    # API -> Node (Express en localhost:5000)
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Fotos subidas (servidas por Node)
    location /uploads/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Assets con hash: cache larga
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA: cualquier otra ruta -> index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
